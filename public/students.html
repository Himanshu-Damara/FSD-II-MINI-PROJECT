<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Operations</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">EDUCATION • ADMIN</p><h1>Student operations</h1><p class="muted">Create, update, search, filter, and delete student records.</p></div><div><a class="button secondary-link" href="index.html">← Dashboard</a></div></header><section class="panel"><div class="toolbar"><div><h2>Student records</h2><p class="muted">Search by name or filter by course.</p></div><div class="filters"><input id="search" placeholder="Search name..."><input id="course" placeholder="Course e.g. CSE"><button onclick="loadStudents()">Search</button><button class="secondary" onclick="resetFilters()">Reset</button></div></div><div id="notice"></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Student</th><th>Course</th><th>Semester</th><th>Email</th><th>Actions</th></tr></thead><tbody id="studentRows"><tr><td colspan="6" class="empty">Loading records...</td></tr></tbody></table></div></section><section id="add" class="panel form-panel"><h2 id="formTitle">Add a student</h2><form id="studentForm"><input type="hidden" id="studentId"><div class="form-grid"><label>Full name<input id="fullName" required></label><label>Age<input id="age" type="number" min="15" max="100" required></label><label>Email<input id="email" type="email" required></label><label>Course<input id="courseForm" required></label><label>Semester<input id="semester" type="number" min="1" max="8" required></label><label>Phone<input id="phone" required></label></div><div><button type="submit">Save student</button><button type="button" class="secondary" onclick="clearForm()">Clear</button></div></form></section></main><script src="auth.js"></script><script src="app.js?v=5"></script></body></html>
